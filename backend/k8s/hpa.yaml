apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:
  name: votewave-hpa
  namespace: votewave

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: votewave-api

  minReplicas: 3
  maxReplicas: 20

  metrics:
    - type: Resource
      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70