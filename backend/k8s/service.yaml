apiVersion: v1
kind: Service
metadata:
  name: votewave-backend
  labels:
    app: votewave
    environment: production
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      name: http
  selector:
    app: votewave
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  labels:
    app: votewave
    environment: production
spec:
  type: ClusterIP
  ports:
    - port: 27017
      protocol: TCP
      name: mongodb
  selector:
    app: votewave
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app: votewave
    environment: production
spec:
  type: ClusterIP
  ports:
    - port: 6379
      protocol: TCP
      name: redis
  selector:
    app: votewave
