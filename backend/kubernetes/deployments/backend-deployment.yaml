apiVersion: apps/v1
kind: Deployment
metadata:
  name: votewave-backend
  labels:
    app: votewave-backend
    version: v1.0.0
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: votewave-backend
  template:
    metadata:
      labels:
        app: votewave-backend
        version: v1.0.0
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: votewave-backend
        image: votewave/backend:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        - containerPort: 3001
          name: dashboard
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        - name: DASHBOARD_PORT
          value: "3001"
        - name: METRICS_PORT
          value: "9090"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: votewave-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: votewave-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: votewave-secrets
              key: jwt-secret
        - name: AWS_REGION
          value: "us-east-1"
        - name: TENANT_ID
          value: "default"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger-collector:14268/api/traces"
        - name: OTEL_SAMPLE_RATE
          value: "0.1"
        - name: LOG_LEVEL
          value: "info"
        - name: ENABLE_METRICS
          value: "true"
        - name: ENABLE_TRACING
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /health/startup
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /app/tmp
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        ports:
        - containerPort: 9121
          name: redis-metrics
          protocol: TCP
        env:
        - name: REDIS_ADDR
          value: "redis://redis-service:6379"
        - name: REDIS_EXPORTER_LOG_FORMAT
          value: "txt"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: config
        configMap:
          name: votewave-config
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - votewave-backend
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        node-type: application
        environment: production
      tolerations:
      - key: "application"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      terminationGracePeriodSeconds: 30
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: votewave-backend-service
  labels:
    app: votewave-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
  - name: dashboard
    port: 3001
    targetPort: 3001
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: votewave-backend

---
apiVersion: v1
kind: Service
metadata:
  name: votewave-backend-headless
  labels:
    app: votewave-backend
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    protocol: TCP
  selector:
    app: votewave-backend

---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: votewave-backend-monitor
  labels:
    app: votewave-backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app: votewave-backend
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    honorLabels: true

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: votewave-backend-pdb
  labels:
    app: votewave-backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: votewave-backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: votewave-backend-hpa
  labels:
    app: votewave-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: votewave-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: votewave-config
  labels:
    app: votewave-backend
data:
  database.json: |
    {
      "host": "postgres-service",
      "port": 5432,
      "database": "votewave",
      "ssl": true,
      "poolSize": 20,
      "connectionTimeoutMillis": 30000,
      "idleTimeoutMillis": 30000
    }
  redis.json: |
    {
      "host": "redis-service",
      "port": 6379,
      "db": 0,
      "keyPrefix": "votewave:",
      "retryDelayOnFailover": 100,
      "maxRetriesPerRequest": 3
    }
  logging.json: |
    {
      "level": "info",
      "format": "json",
      "colorize": false,
      "timestamp": true,
      "prettyPrint": false
    }
  monitoring.json: |
    {
      "enabled": true,
      "metricsInterval": 10000,
      "healthCheckInterval": 30000,
      "alertThresholds": {
        "errorRate": 5,
        "responseTime": 1000,
        "memoryUsage": 85,
        "cpuUsage": 80
      }
    }

---
apiVersion: v1
kind: Secret
metadata:
  name: votewave-secrets
  labels:
    app: votewave-backend
type: Opaque
data:
  database-url: <base64-encoded-database-url>
  redis-url: <base64-encoded-redis-url>
  jwt-secret: <base64-encoded-jwt-secret>
  encryption-key: <base64-encoded-encryption-key>

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: votewave-backend-ingress
  labels:
    app: votewave-backend
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.votewave.com
    secretName: votewave-backend-tls
  rules:
  - host: api.votewave.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: votewave-backend-service
            port:
              number: 80
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: votewave-backend-service
            port:
              number: 80
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: votewave-backend-service
            port:
              number: 9090
      - path: /dashboard
        pathType: Prefix
        backend:
          service:
            name: votewave-backend-service
            port:
              number: 3001
