<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Voting - VoteWave</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://js.paystack.co/v2/paystack.js"></script>
  <link rel="stylesheet" href="css/micro-site.css">
  <style>
    :root { --bg:#0f172a; --surface:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.06); --text:#f1f5f9; --text-muted:#94a3b8; --primary:#6366f1; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; margin:0; display:flex; flex-direction:column; align-items:center; }
    .container { width:100%; max-width:800px; padding:2rem 1.5rem; }
    .header { text-align:center; margin-bottom:2rem; }
    .category { margin-bottom:2rem; }
    .candidate { display:flex; align-items:center; gap:1rem; padding:1rem; background:var(--surface); border:1px solid var(--border); border-radius:0.75rem; cursor:pointer; margin-bottom:0.5rem; }
    .candidate.selected { border-color:var(--primary); background:rgba(99,102,241,0.05); }
    .avatar { width:3rem; height:3rem; border-radius:0.75rem; background:linear-gradient(135deg,#6366f1,#8b5cf6); display:flex; align-items:center; justify-content:center; font-weight:700; color:white; }
    .radio { width:1.5rem; height:1.5rem; border-radius:50%; border:2px solid var(--border); }
    .candidate.selected .radio { border-color:var(--primary); background:var(--primary); }
    .btn { width:100%; padding:1rem; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; border:none; border-radius:0.75rem; font-weight:700; cursor:pointer; margin-top:1rem; }
    .btn:disabled { opacity:0.5; }
    .footer { text-align:center; margin-top:2rem; color:var(--text-muted); font-size:0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 id="eventTitle">Event</h1>
      <p id="eventDesc"></p>
    </div>
    <div id="categories"></div>
    <div style="margin:1.5rem 0;">
      <label>Votes (GHS 1      cd 'c:\Users\STAR MEDIA\Desktop\votewave'
      npm start each)</label>
      <div style="display:flex;align-items:center;gap:0.5rem;">
        <button onclick="changeQty(-1)" style="width:2rem;height:2rem;">-</button>
        <input type="number" id="qty" value="1" min="1" max="100" readonly style="width:4rem;text-align:center;">
        <button onclick="changeQty(1)" style="width:2rem;height:2rem;">+</button>
      </div>
      <p>Total: GHS <span id="total">5.00</span></p>
    </div>
    <button class="btn" id="payBtn" disabled onclick="pay()">Pay & Vote</button>
    <div class="footer">Powered by <strong>VoteWave</strong></div>
  </div>
  <script src="js/event-micro.js"></script>
</body>
</html>
