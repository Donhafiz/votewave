<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nominee Registration - VoteWave</title>
  <meta name="theme-color" content="#6366f1">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root { --bg:#0f172a; --surface:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.06); --text:#f1f5f9; --text-muted:#94a3b8; --primary:#6366f1; --success:#10b981; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .form-container { background:var(--surface); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:1.5rem; padding:2.5rem; width:100%; max-width:500px; box-shadow:0 25px 50px rgba(0,0,0,0.3); }
    .form-header { text-align:center; margin-bottom:2rem; }
    .form-header .icon { width:4rem; height:4rem; background:rgba(99,102,241,0.1); border-radius:1rem; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; font-size:2rem; }
    .form-header h2 { font-size:1.5rem; margin-bottom:0.5rem; }
    .form-header p { color:var(--text-muted); font-size:0.9rem; }
    
    .form-group { margin-bottom:1.25rem; }
    .form-group label { display:block; font-size:0.85rem; font-weight:500; color:#cbd5e1; margin-bottom:0.4rem; }
    .form-group input, .form-group select, .form-group textarea { width:100%; padding:0.75rem 1rem; background:var(--bg); border:1px solid var(--border); border-radius:0.75rem; color:var(--text); font-size:0.95rem; font-family:inherit; outline:none; transition:all 0.3s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.1); }
    .form-group textarea { resize:vertical; min-height:80px; }
    
    .submit-btn { width:100%; padding:0.9rem; background:linear-gradient(135deg,#6366f1,#8b5cf6); border:none; border-radius:0.75rem; color:white; font-size:1rem; font-weight:600; font-family:inherit; cursor:pointer; transition:all 0.3s; }
    .submit-btn:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(99,102,241,0.4); }
    
    .success-state { display:none; text-align:center; padding:2rem; }
    .success-state .check { width:4rem; height:4rem; background:rgba(16,185,129,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; font-size:2rem; }
    .powered-by { text-align:center; margin-top:1.5rem; font-size:0.8rem; color:var(--text-muted); }
    .powered-by strong { color:var(--primary); }
  </style>
</head>
<body>
  <div class="form-container">
    <div id="formState">
      <div class="form-header">
        <div class="icon">📝</div>
        <h2>Register as Nominee</h2>
        <p id="eventNameDisplay">Fill in your details to apply</p>
      </div>
      
      <form id="nomineeForm" onsubmit="return false;">
        <div class="form-group"><label>Full Name *</label><input type="text" id="name" placeholder="Your full name" required></div>
        <div class="form-group"><label>Email Address *</label><input type="email" id="email" placeholder="your@email.com" required></div>
        <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" placeholder="e.g., 024XXXXXXX"></div>
        <div class="form-group"><label>Category / Position *</label><select id="category" required></select></div>
        <div class="form-group"><label>Why should people vote for you? *</label><textarea id="bio" rows="3" placeholder="Tell voters about yourself, your qualifications, and your vision..." required></textarea></div>
        <button type="button" class="submit-btn" onclick="submitNomination()">Submit Nomination</button>
      </form>
    </div>
    
    <div id="successState" class="success-state">
      <div class="check">✅</div>
      <h2>Nomination Submitted!</h2>
      <p style="color:var(--text-muted);">Your nomination has been received. You will be notified when approved.</p>
    </div>
    
    <div class="powered-by">Powered by <strong>VoteWave</strong></div>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('event');
      
      // Load event positions
      let elections = JSON.parse(localStorage.getItem('votewave_elections') || '[]');
      const event = elections.find(e => e.slug === slug) || { title:'Event', positions:['Category 1','Category 2'] };
      
      document.getElementById('eventNameDisplay').textContent = 'Apply for: ' + event.title;
      const select = document.getElementById('category');
      (event.positions||[]).forEach(p => { const opt = document.createElement('option'); opt.value = p; opt.textContent = p; select.appendChild(opt); });
    });
    
    function submitNomination() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const category = document.getElementById('category').value;
      const bio = document.getElementById('bio').value.trim();
      
      if (!name || !email || !category || !bio) { alert('Please fill all required fields'); return; }
      
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('event');
      
      let nominations = JSON.parse(localStorage.getItem('votewave_nominations') || '[]');
      nominations.push({ name, email, phone, category, bio, eventSlug:slug, timestamp:new Date().toISOString(), status:'pending' });
      localStorage.setItem('votewave_nominations', JSON.stringify(nominations));
      
      document.getElementById('formState').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
    }
  </script>
</body>
</html>
