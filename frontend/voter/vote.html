<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cast Vote - VoteWave</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://js.paystack.co/v2/paystack.js"></script>
  <script src="../js/main.js"></script>
  <style>
    :root { --bg:#0f172a; --surface:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.06); --text:#f1f5f9; --text-muted:#94a3b8; --primary:#6366f1; --success:#10b981; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; margin:0; padding:2rem; }
    .container { max-width:800px; margin:0 auto; }
    .back { color:var(--text-muted); text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem; margin-bottom:1.5rem; }
    .candidate-card { background:var(--surface); border:2px solid var(--border); border-radius:1rem; padding:1.25rem; display:flex; align-items:center; gap:1rem; cursor:pointer; margin-bottom:0.75rem; transition:0.3s; }
    .candidate-card.selected { border-color:var(--primary); background:rgba(99,102,241,0.05); }
    .radio { width:1.5rem; height:1.5rem; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; }
    .candidate-card.selected .radio { border-color:var(--primary); background:var(--primary); }
    .radio::after { content:''; width:0.5rem; height:0.5rem; background:white; border-radius:50%; opacity:0; }
    .candidate-card.selected .radio::after { opacity:1; }
    .btn { width:100%; padding:1rem; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; border:none; border-radius:0.75rem; font-size:1rem; font-weight:700; cursor:pointer; margin-top:1rem; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <a href="elections.html" class="back">← Back</a>
    <h1 id="title"></h1>
    <div id="positions"></div>
    <div style="margin:1.5rem 0;">
      <label>Number of votes (GHS 5 each)</label>
      <div style="display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem;">
        <button onclick="changeQty(-1)" style="width:2rem;height:2rem;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;">-</button>
        <input type="number" id="qty" value="1" min="1" max="100" readonly style="width:4rem;text-align:center;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.5rem;">
        <button onclick="changeQty(1)" style="width:2rem;height:2rem;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;">+</button>
      </div>
      <p style="margin-top:0.5rem;font-size:1.2rem;">Total: GHS <span id="total">1.00</span></p>
    </div>
    <button class="btn" id="payBtn" disabled onclick="pay()">Pay & Vote</button>
  </div>
  <script>
    const VOTE_PRICE = 1;
    let selectedCandidate = null;
    const params = new URLSearchParams(window.location.search);
    const electionId = params.get('id');
    const elections = JSON.parse(localStorage.getItem('votewave_elections')||'[]');
    const election = elections.find(e=>e._id===electionId)||{title:'Election',positions:[]};
    document.getElementById('title').textContent = election.title;
    const candidates = JSON.parse(localStorage.getItem('votewave_candidates')||'[]').filter(c=>c.electionId===electionId);
    document.getElementById('positions').innerHTML = (election.positions||[]).map(pos => {
      const posCandidates = candidates.filter(c=>c.position===pos);
      return `<div style="margin-bottom:2rem;"><h3>${pos} (${posCandidates.length})</h3>` +
        posCandidates.map(c => `<div class="candidate-card" onclick="select('${c._id}',this)"><div style="width:3rem;height:3rem;border-radius:0.75rem;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;color:white;">${c.firstName[0]}${c.lastName[0]}</div><div><strong>${c.firstName} ${c.lastName}</strong><p style="color:var(--text-muted);font-size:0.85rem;">${c.bio||''}</p></div><div class="radio"></div></div>`).join('') + '</div>';
    }).join('');
    function select(id, el) {
      document.querySelectorAll('.candidate-card').forEach(c=>c.classList.remove('selected'));
      el.classList.add('selected');
      selectedCandidate = id;
      document.getElementById('payBtn').disabled = false;
    }
    function changeQty(delta) {
      const qty = document.getElementById('qty');
      let val = parseInt(qty.value) + delta;
      if (val<1) val=1; if (val>100) val=100;
      qty.value = val;
      document.getElementById('total').textContent = (val*VOTE_PRICE).toFixed(2);
    }
    function pay() {
      if (!selectedCandidate) return;
      const qty = parseInt(document.getElementById('qty').value);
      const amount = qty * VOTE_PRICE;
      const handler = PaystackPop.setup({
        key: 'pk_test_xxxxxxxx', // replace with your key
        email: 'voter@example.com',
        amount: amount*100,
        currency: 'GHS',
        ref: 'VW-'+Date.now(),
        callback: function(response) {
          let candidates = JSON.parse(localStorage.getItem('votewave_candidates')||'[]');
          const idx = candidates.findIndex(c=>c._id===selectedCandidate);
          if (idx!==-1) candidates[idx].votes = (candidates[idx].votes||0) + qty;
          localStorage.setItem('votewave_candidates', JSON.stringify(candidates));
          alert('✅ Vote recorded!');
        },
        onClose: ()=> alert('Payment cancelled')
      });
      handler.openIframe();
    }
  </script>
</body>
</html>
