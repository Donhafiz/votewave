<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Elections - VoteWave</title>
  <meta name="theme-color" content="#6366f1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root { --bg:#0f172a; --surface:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.06); --text:#f1f5f9; --text-muted:#94a3b8; --primary:#6366f1; --success:#10b981; --warning:#f59e0b; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    .container { max-width:1200px; margin:0 auto; padding:2rem 1.5rem; }
    
    .navbar { background:var(--bg); border-bottom:1px solid var(--border); padding:0 1.5rem; position:sticky; top:0; }
    .nav-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:4rem; }
    .nav-logo { font-size:1.25rem; font-weight:800; color:var(--text); text-decoration:none; }
    .nav-logo span { background:linear-gradient(135deg,#818cf8,#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .nav-links { display:flex; gap:1.5rem; }
    .nav-links a { color:var(--text-muted); text-decoration:none; font-size:0.9rem; font-weight:500; }
    .nav-links a:hover,.nav-links a.active { color:var(--text); }
    
    .page-header { text-align:center; padding:3rem 0 2rem; }
    .page-header h1 { font-size:2.5rem; font-weight:800; }
    .page-header p { color:var(--text-muted); }
    
    .clubs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1.5rem; }
    
    .club-card { background:var(--surface); border:1px solid var(--border); border-radius:1rem; padding:1.75rem; text-align:center; transition:all 0.3s; cursor:pointer; }
    .club-card:hover { border-color:rgba(99,102,241,0.3); transform:translateY(-4px); box-shadow:0 20px 40px rgba(0,0,0,0.3); }
    .club-icon { font-size:3rem; margin-bottom:1rem; }
    .club-card h3 { font-size:1.2rem; font-weight:700; margin-bottom:0.5rem; }
    .club-card p { font-size:0.85rem; color:var(--text-muted); margin-bottom:0.5rem; }
    
    .btn { display:inline-flex; align-items:center; gap:0.5rem; padding:0.6rem 1.25rem; font-size:0.875rem; font-weight:600; border:none; border-radius:0.5rem; cursor:pointer; transition:all 0.2s; font-family:inherit; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; text-decoration:none; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(99,102,241,0.4); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="../../index.html" class="nav-logo">🏛️ Vote<span>Wave</span></a>
      <div class="nav-links">
        <a href="../../index.html">Home</a>
        <a href="elections.html">Elections</a>
        <a href="nominations.html">Nominations</a>
        <a href="events.html">Events</a>
        <a href="club-elections.html" class="active">Clubs</a>
      </div>
    </div>
  </nav>
  
  <div class="container">
    <div class="page-header">
      <h1>🏛️ Club Elections</h1>
      <p>Participate in club and organization leadership elections</p>
    </div>
    
    <div class="clubs-grid" id="clubsGrid"></div>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const clubs = [
        { id:'1', icon:'💻', name:'Tech Innovation Club', description:'Electing President, VP, and Secretary for 2026', members:328, status:'Active', positions:['President','Vice President','Secretary'] },
        { id:'2', icon:'🎨', name:'Creative Arts Society', description:'Leadership election for 2026 term', members:156, status:'Active', positions:['President','Treasurer'] },
        { id:'3', icon:'🏀', name:'Sports & Athletics', description:'Team captain and committee elections', members:245, status:'Upcoming', positions:['Captain','Vice Captain'] },
        { id:'4', icon:'📚', name:'Literary & Debate Club', description:'Executive board elections', members:198, status:'Active', positions:['President','Secretary','Debate Lead'] },
        { id:'5', icon:'🌍', name:'Environmental Action Group', description:'Coordinator and team lead voting', members:112, status:'Completed', positions:['Coordinator'] },
        { id:'6', icon:'🎵', name:'Music & Performing Arts', description:'Club president election', members:180, status:'Upcoming', positions:['President'] },
      ];
      
      document.getElementById('clubsGrid').innerHTML = clubs.map(c => `
        <div class="club-card" onclick="window.location.href='vote.html?id=${c.id}'">
          <div class="club-icon">${c.icon}</div>
          <span style="display:inline-block;padding:0.2rem 0.75rem;border-radius:100px;font-size:0.7rem;font-weight:600;margin-bottom:0.75rem;background:${c.status==='Active'?'rgba(16,185,129,0.15)':c.status==='Completed'?'rgba(100,116,139,0.15)':'rgba(245,158,11,0.15)'};color:${c.status==='Active'?'#10b981':c.status==='Completed'?'#94a3b8':'#f59e0b'}">${c.status}</span>
          <h3>${c.name}</h3>
          <p>${c.description}</p>
          <p style="font-size:0.8rem;color:var(--text-muted);">👥 ${c.members} members</p>
          <div style="display:flex;flex-wrap:wrap;gap:0.35rem;justify-content:center;margin:0.75rem 0;">
            ${c.positions.map(p => `<span style="padding:0.2rem 0.6rem;background:rgba(255,255,255,0.03);border-radius:100px;font-size:0.7rem;color:var(--text-muted);">📋 ${p}</span>`).join('')}
          </div>
          <a href="vote.html?id=${c.id}" class="btn">${c.status==='Active'?'Vote Now':'View Details'}</a>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
