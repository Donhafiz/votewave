<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Elections - VoteWave</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    :root { --bg:#0f172a; --surface:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.06); --text:#f1f5f9; --text-muted:#94a3b8; --primary:#6366f1; --success:#10b981; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; margin:0; }
    .container { max-width:1200px; margin:0 auto; padding:2rem 1.5rem; }
    .navbar { background:rgba(15,23,42,0.9); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 1.5rem; position:sticky; top:0; z-index:100; }
    .nav-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:4rem; }
    .nav-logo { font-size:1.25rem; font-weight:800; color:var(--text); text-decoration:none; }
    .nav-links { display:flex; gap:1.5rem; }
    .nav-links a { color:var(--text-muted); text-decoration:none; font-size:0.9rem; }
    .nav-links a.active { color:var(--text); }
    .page-header { text-align:center; padding:3rem 0 1rem; }
    .filters { display:flex; gap:0.5rem; justify-content:center; margin-bottom:2rem; flex-wrap:wrap; }
    .filter-btn { padding:0.5rem 1.25rem; border-radius:100px; border:1px solid var(--border); background:none; color:var(--text-muted); cursor:pointer; font-family:inherit; }
    .filter-btn.active { background:rgba(99,102,241,0.15); color:var(--primary); border-color:rgba(99,102,241,0.3); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:1.5rem; }
    .card { background:var(--surface); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:1rem; padding:1.75rem; cursor:pointer; transition:0.3s; }
    .card:hover { border-color:rgba(99,102,241,0.3); transform:translateY(-4px); box-shadow:0 20px 40px rgba(0,0,0,0.3); }
    .btn { display:inline-flex; align-items:center; gap:0.5rem; padding:0.6rem 1.25rem; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; border:none; border-radius:0.5rem; cursor:pointer; font-weight:600; text-decoration:none; }
  </style>
</head>
<body>
  <nav class="navbar"><div class="nav-inner"><a href="../../index.html" class="nav-logo">🗳️ VoteWave</a><div class="nav-links"><a href="elections.html" class="active">Elections</a></div></div></nav>
  <div class="container">
    <div class="page-header"><h1>Active Elections</h1></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>
  <script src="../js/main.js"></script>
  <script>
    let elections = JSON.parse(localStorage.getItem('votewave_elections') || '[]');
    function render(type='all') {
      let filtered = type==='all' ? elections : elections.filter(e=>e.type===type);
      document.getElementById('grid').innerHTML = filtered.map(e => {
        const days = Math.ceil((new Date(e.endDate)-new Date())/(86400000));
        return `<div class="card" onclick="location.href='vote.html?id=${e._id}'">
          <span style="background:rgba(99,102,241,0.15);color:#818cf8;padding:0.2rem 0.7rem;border-radius:100px;font-size:0.7rem;">${e.type}</span>
          <span style="margin-left:0.5rem;padding:0.2rem 0.6rem;border-radius:100px;font-size:0.65rem;background:${e.status==='active'?'rgba(16,185,129,0.15)':'rgba(245,158,11,0.15)'};color:${e.status==='active'?'#10b981':'#f59e0b'}">${e.status}</span>
          <h3 style="margin:0.75rem 0 0.5rem;">${e.title}</h3>
          <p style="color:var(--text-muted);font-size:0.85rem;">${e.positions?.join(' · ')}</p>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:1rem;">
            <span style="font-size:0.8rem;color:var(--text-muted);">${e.status==='active'?days+' days left':e.status==='upcoming'?'Starts soon':'Ended'}</span>
            <a href="vote.html?id=${e._id}" class="btn">Vote →</a>
          </div>
        </div>`;
      }).join('') || '<p style="text-align:center;color:var(--text-muted);">No elections yet.</p>';
    }
    // Filter buttons
    const types = ['all','student','nomination','event','club','corporate'];
    document.getElementById('filters').innerHTML = types.map(t => `<button class="filter-btn ${t==='all'?'active':''}" onclick="document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');render('${t}')">${t==='all'?'All':t}</button>`).join('');
    render();
  </script>
</body>
</html>
