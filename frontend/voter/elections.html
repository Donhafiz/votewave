<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Elections - VoteWave</title>
  <meta name="theme-color" content="#6366f1">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root { --bg:#0f172a; --surface:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.06); --text:#f1f5f9; --text-muted:#94a3b8; --primary:#6366f1; --success:#10b981; --warning:#f59e0b; --radius:1rem; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }
    .container { max-width:1200px; margin:0 auto; padding:0 1.5rem; }
    
    .navbar { background:var(--bg); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 1.5rem; position:sticky; top:0; z-index:100; }
    .nav-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:4rem; }
    .nav-logo { font-size:1.25rem; font-weight:800; color:var(--text); text-decoration:none; }
    .nav-logo span { background:linear-gradient(135deg,#818cf8,#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .nav-links { display:flex; gap:1.5rem; }
    .nav-links a { color:var(--text-muted); text-decoration:none; font-size:0.9rem; font-weight:500; }
    .nav-links a:hover,.nav-links a.active { color:var(--text); }
    .menu-toggle { display:none; background:none; border:none; color:var(--text); font-size:1.5rem; cursor:pointer; }
    
    .page-header { text-align:center; padding:3rem 0 1.5rem; }
    .page-header h1 { font-size:2.5rem; font-weight:800; }
    .page-header p { color:var(--text-muted); }
    
    .filters-bar { display:flex; gap:0.5rem; margin-bottom:2rem; flex-wrap:wrap; justify-content:center; }
    .filter-btn { padding:0.5rem 1.25rem; border-radius:100px; border:1px solid var(--border); background:none; color:var(--text-muted); font-size:0.85rem; font-weight:500; cursor:pointer; transition:all 0.2s; font-family:inherit; }
    .filter-btn.active,.filter-btn:hover { background:rgba(99,102,241,0.15); color:var(--primary); border-color:rgba(99,102,241,0.3); }
    .search-input { padding:0.5rem 1.25rem; background:var(--surface); border:1px solid var(--border); border-radius:100px; color:var(--text); font-size:0.85rem; font-family:inherit; outline:none; min-width:200px; }
    .search-input:focus { border-color:var(--primary); }
    
    .elections-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(350px,1fr)); gap:1.5rem; padding-bottom:4rem; }
    .election-card { background:var(--surface); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:var(--radius); padding:1.75rem; transition:all 0.3s; cursor:pointer; }
    .election-card:hover { border-color:rgba(99,102,241,0.3); transform:translateY(-4px); box-shadow:0 20px 40px rgba(0,0,0,0.2); }
    .election-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,#6366f1,#8b5cf6,#06b6d4); opacity:0; transition:opacity 0.3s; }
    .election-card:hover::before { opacity:1; }
    .card-type-badge { display:inline-block; padding:0.25rem 0.75rem; border-radius:100px; font-size:0.7rem; font-weight:600; text-transform:uppercase; margin-bottom:0.75rem; }
    .card-type-badge.student { background:rgba(99,102,241,0.15); color:#818cf8; }
    .card-type-badge.nomination { background:rgba(245,158,11,0.15); color:#f59e0b; }
    .card-type-badge.event { background:rgba(6,182,212,0.15); color:#06b6d4; }
    .card-type-badge.club { background:rgba(16,185,129,0.15); color:#10b981; }
    .card-status { display:inline-block; padding:0.2rem 0.6rem; border-radius:100px; font-size:0.65rem; font-weight:600; margin-left:0.5rem; }
    .card-status.active { background:rgba(16,185,129,0.15); color:#10b981; }
    .card-status.upcoming { background:rgba(245,158,11,0.15); color:#f59e0b; }
    .card-status.completed { background:rgba(100,116,139,0.15); color:#94a3b8; }
    .election-card h3 { font-size:1.2rem; font-weight:700; margin-bottom:0.5rem; }
    .election-card p { font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem; }
    .card-meta { display:flex; gap:1.5rem; padding:1rem 0; border-top:1px solid var(--border); margin-bottom:1rem; }
    .card-meta .meta-item { display:flex; flex-direction:column; }
    .card-meta .meta-item span { font-size:1rem; font-weight:700; }
    .card-meta .meta-item small { font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; }
    
    .btn { display:inline-flex; align-items:center; gap:0.5rem; padding:0.6rem 1.25rem; font-size:0.875rem; font-weight:600; border:none; border-radius:0.5rem; cursor:pointer; transition:all 0.2s; font-family:inherit; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; text-decoration:none; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(99,102,241,0.4); }
    
    @media (max-width:768px) {
      .nav-links { display:none; }
      .nav-links.open { display:flex; flex-direction:column; position:absolute; top:4rem; left:0; right:0; background:var(--bg); padding:1rem; border-bottom:1px solid var(--border); }
      .menu-toggle { display:block; }
      .elections-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">🗳️ Vote<span>Wave</span></a>
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="nav-links" id="navLinks">
        <a href="../index.html">Home</a>
        <a href="elections.html" class="active">Elections</a>
        <a href="nominations.html">Nominations</a>
        <a href="events.html">Events</a>
        <a href="club-elections.html">Clubs</a>
      </div>
    </div>
  </nav>
  
  <div class="container">
    <div class="page-header"><h1>🗳️ Active Elections</h1><p>Browse and vote in ongoing elections</p></div>
    
    <div class="filters-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="student">🎓 Student</button>
      <button class="filter-btn" data-filter="nomination">🏆 Nominations</button>
      <button class="filter-btn" data-filter="event">🎪 Events</button>
      <button class="filter-btn" data-filter="club">🏛️ Clubs</button>
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search...">
    </div>
    
    <div class="elections-grid" id="electionsGrid"></div>
  </div>
  
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('navLinks').classList.toggle('open'));
      loadElections();
      document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        loadElections(this.dataset.filter);
      }));
      document.getElementById('searchInput').addEventListener('input', debounce(() => loadElections(document.querySelector('.filter-btn.active')?.dataset.filter || 'all'), 300));
    });
    
    function loadElections(typeFilter='all') {
      let elections = JSON.parse(localStorage.getItem('votewave_elections') || '[]');
      if (elections.length === 0) elections = [
        { _id:'1', title:'Student Council 2026', type:'student', status:'active', positions:['President','VP'], totalVotes:1247, endDate:'2026-03-20' },
        { _id:'2', title:'Best Teacher Award', type:'nomination', status:'active', positions:['Best Lecturer'], totalVotes:892, endDate:'2026-03-18' },
        { _id:'3', title:'Annual Fest Theme', type:'event', status:'completed', positions:['Theme'], totalVotes:2150, endDate:'2026-03-05' },
        { _id:'4', title:'Tech Club President', type:'club', status:'upcoming', positions:['President'], totalVotes:0, startDate:'2026-03-25' }
      ];
      
      const search = document.getElementById('searchInput')?.value?.toLowerCase();
      let filtered = elections;
      if (typeFilter !== 'all') filtered = filtered.filter(e => e.type === typeFilter);
      if (search) filtered = filtered.filter(e => e.title.toLowerCase().includes(search));
      
      const typeIcons = { student:'🎓', nomination:'🏆', event:'🎪', club:'🏛️', corporate:'🏢' };
      const grid = document.getElementById('electionsGrid');
      grid.innerHTML = filtered.length === 0 ? '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted);">No elections found</div>' : filtered.map(e => {
        const daysLeft = Math.ceil((new Date(e.endDate)-new Date())/(1000*60*60*24));
        return `<div class="election-card" onclick="window.location.href='vote.html?id=${e._id}'">
          <span class="card-type-badge ${e.type}">${typeIcons[e.type]||'🗳️'} ${e.type}</span>
          <span class="card-status ${e.status}">${e.status.toUpperCase()}</span>
          <h3>${e.title}</h3>
          <p>${(e.positions||[]).join(' · ')}</p>
          <div class="card-meta"><div class="meta-item"><span>${(e.totalVotes||0).toLocaleString()}</span><small>Votes</small></div><div class="meta-item"><span>${e.status==='active'?daysLeft+'d':e.status==='upcoming'?'Soon':'Ended'}</span></div></div>
          <a href="vote.html?id=${e._id}" class="btn">${e.status==='active'?'Vote Now →':'View →'}</a>
        </div>`;
      }).join('');
    }
    
    function debounce(f,w) { let t; return function(...a) { clearTimeout(t); t = setTimeout(() => f.apply(this,a), w); }; }
  </script>
</body>
</html>
