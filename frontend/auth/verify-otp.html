<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - VoteWave</title>
  <meta name="theme-color" content="#6366f1">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root { --bg:#0f172a; --surface:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.06); --text:#f1f5f9; --text-muted:#94a3b8; --primary:#6366f1; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    
    .verify-card {
      background:var(--surface); backdrop-filter:blur(20px); border:1px solid var(--border);
      border-radius:1.5rem; padding:3rem 2.5rem; width:100%; max-width:450px; text-align:center;
      box-shadow:0 25px 50px rgba(0,0,0,0.3);
    }
    
    .verify-icon { width:4rem; height:4rem; background:rgba(99,102,241,0.1); border-radius:1rem; display:flex; align-items:center; justify-content:center; margin:0 auto 1.5rem; }
    .verify-icon svg { width:2rem; height:2rem; color:var(--primary); }
    
    h1 { font-size:1.75rem; font-weight:800; margin-bottom:0.5rem; }
    p { color:var(--text-muted); margin-bottom:1.5rem; font-size:0.95rem; }
    
    .otp-inputs { display:flex; gap:0.75rem; justify-content:center; margin-bottom:1.5rem; }
    
    .otp-input {
      width:3.5rem; height:4rem; text-align:center; font-size:1.5rem; font-weight:700;
      background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:0.75rem;
      color:var(--text); font-family:inherit; outline:none; transition:all 0.3s;
    }
    
    .otp-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.1); }
    
    .btn { width:100%; padding:0.9rem; background:linear-gradient(135deg,#6366f1,#8b5cf6); border:none; border-radius:0.75rem; color:white; font-size:1rem; font-weight:600; font-family:inherit; cursor:pointer; transition:all 0.3s; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(99,102,241,0.4); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    
    .resend { margin-top:1rem; font-size:0.85rem; color:var(--text-muted); }
    .resend a { color:var(--primary); cursor:pointer; text-decoration:none; }
    .resend a:hover { text-decoration:underline; }
    
    .back-link { display:inline-flex; align-items:center; gap:0.5rem; color:var(--text-muted); text-decoration:none; margin-top:1.5rem; font-size:0.9rem; }
    .back-link:hover { color:var(--text); }
  </style>
</head>
<body>
  <div class="verify-card">
    <div class="verify-icon"><i data-lucide="mail-check"></i></div>
    <h1>Verify Your Email</h1>
    <p>We sent a 6-digit code to<br><strong id="userEmail">your@email.com</strong></p>
    
    <div class="otp-inputs" id="otpInputs">
      <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="one-time-code">
      <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
      <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
      <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
      <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
      <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
    </div>
    
    <button class="btn" id="verifyBtn" type="button">
      <i data-lucide="check-circle"></i> Verify Email
    </button>
    
    <p class="resend">
      Didn't receive the code? <a id="resendOtpLink">Resend Code</a>
    </p>
    
    <a href="register.html" class="back-link"><i data-lucide="arrow-left"></i> Back to Register</a>
  </div>
  
  <div id="toast" style="position:fixed;top:1rem;right:1rem;z-index:999;"></div>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      
      const params = new URLSearchParams(window.location.search);
      const email = params.get('email');
      if (email) {
        document.getElementById('userEmail').textContent = email;
      }
      
      // OTP input auto-focus
      const inputs = document.querySelectorAll('.otp-input');
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          if (e.target.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });
        
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && index > 0) {
            inputs[index - 1].focus();
          }
        });
        
        // Only allow numbers
        input.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
      });
      
      // Focus first input
      inputs[0]?.focus();
      document.getElementById('verifyBtn')?.addEventListener('click', verifyOTP);
      document.getElementById('resendOtpLink')?.addEventListener('click', resendOTP);
    });
    
    function getOTP() {
      return Array.from(document.querySelectorAll('.otp-input')).map(i => i.value).join('');
    }
    
    function verifyOTP() {
      const otp = getOTP();
      if (otp.length !== 6) {
        showToast('Please enter the complete 6-digit code', 'error');
        return;
      }
      
      const btn = document.getElementById('verifyBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:1.25rem;height:1.25rem;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;"></span>';
      
      // Simulate verification
      setTimeout(() => {
        showToast('Email verified successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      }, 2000);
    }
    
    function resendOTP() {
      showToast('New verification code sent!', 'success');
    }
    
    function showToast(message, type) {
      const container = document.getElementById('toast');
      const toast = document.createElement('div');
      toast.style.cssText = `padding:1rem 1.5rem;background:#1e293b;border-left:3px solid ${type==='success'?'#10b981':'#ef4444'};border-radius:0.5rem;color:white;font-size:0.875rem;box-shadow:0 10px 25px rgba(0,0,0,0.3);animation:slideIn 0.3s ease;`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity='0'; toast.style.transition='opacity 0.3s'; setTimeout(()=>toast.remove(),300); }, 3000);
    }
  </script>
  
  <style>
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes slideIn { from { opacity:0; transform:translateX(100%); } to { opacity:1; transform:translateX(0); } }
  </style>
</body>
</html>
