<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - VoteWave</title>
  <meta name="theme-color" content="#6366f1">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --bg-deep: #0a0a14;
      --bg-primary: #12122a;
      --bg-card: rgba(18, 18, 42, 0.75);
      --glass-bg: rgba(255,255,255,0.015);
      --glass-border: rgba(255,255,255,0.05);
      --glass-hover: rgba(255,255,255,0.03);
      
      --coral: #ff6b6b; --coral-glow: rgba(255,107,107,0.3);
      --tangerine: #ffa726; --tangerine-glow: rgba(255,167,38,0.3);
      --mint: #2ed573; --mint-glow: rgba(46,213,115,0.3);
      --ocean: #4834d4; --twilight: #6c5ce7; --rose: #ff6b9d; --cyan: #00d2d3;
      
      --text-primary: #f0f0f5; --text-secondary: #c5c5d2;
      --text-muted: #8888a0; --text-dim: #666680;
      
      --shadow-coral: 0 8px 40px rgba(255,107,107,0.25);
      --shadow-card: 0 20px 60px rgba(0,0,0,0.4);
      
      --bg: var(--bg-deep);
      --surface: var(--glass-bg);
      --border: var(--glass-border);
      --text: var(--text-primary);
      --text-muted: var(--text-muted);
      --primary: var(--coral);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    
    .card {
      background:var(--surface); backdrop-filter:blur(20px); border:1px solid var(--border);
      border-radius:1.5rem; padding:3rem 2.5rem; width:100%; max-width:450px; text-align:center;
      box-shadow:0 25px 50px rgba(0,0,0,0.3);
    }
    
    .icon-circle { width:4rem; height:4rem; background:rgba(245,158,11,0.1); border-radius:1rem; display:flex; align-items:center; justify-content:center; margin:0 auto 1.5rem; }
    .icon-circle svg { width:2rem; height:2rem; color:#f59e0b; }
    
    h1 { font-size:1.75rem; font-weight:800; margin-bottom:0.5rem; }
    p { color:var(--text-muted); margin-bottom:1.5rem; }
    
    .input-group { text-align:left; margin-bottom:1.25rem; }
    .input-group label { display:block; font-size:0.85rem; font-weight:500; color:#cbd5e1; margin-bottom:0.4rem; }
    .input-group input { width:100%; padding:0.75rem 1rem; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:0.75rem; color:var(--text); font-size:0.95rem; font-family:inherit; outline:none; transition:all 0.3s; }
    .input-group input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.1); }
    
    .btn { width:100%; padding:0.9rem; background:linear-gradient(135deg,#6366f1,#8b5cf6); border:none; border-radius:0.75rem; color:white; font-size:1rem; font-weight:600; font-family:inherit; cursor:pointer; transition:all 0.3s; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(99,102,241,0.4); }
    
    .back { display:inline-flex; align-items:center; gap:0.5rem; color:var(--text-muted); text-decoration:none; margin-top:1.5rem; font-size:0.9rem; }
    .back:hover { color:var(--text); }
    
    .success-state { display:none; }
    .success-state.active { display:block; }
    .form-state.active { display:block; }
    .form-state { display:block; }
    .form-state.hidden { display:none; }
  </style>
</head>
<body>
  <div id="forgotStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div class="card" role="main" aria-label="Forgot password">
    <div id="formState" class="form-state">
      <div class="icon-circle"><i data-lucide="key-round"></i></div>
      <h1>Forgot Password?</h1>
      <p>Enter your email and we'll send you a reset link</p>
      
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="resetEmail" placeholder="you@example.com" required>
      </div>
      
      <button id="sendResetBtn" class="btn" type="button">
        <i data-lucide="send"></i> Send Reset Link
      </button>
    </div>
    
    <div id="successState" class="success-state">
      <div class="icon-circle" style="background:rgba(16,185,129,0.1);"><i data-lucide="check-circle" style="color:#10b981;"></i></div>
      <h1>Check Your Email</h1>
      <p>We've sent a password reset link to<br><strong id="sentEmail">your@email.com</strong></p>
      <p style="font-size:0.85rem;">Didn't receive it? Check spam or <a id="resendResetLink" style="color:var(--primary);cursor:pointer;">resend</a></p>
    </div>
    
    <a href="login.html" class="back"><i data-lucide="arrow-left"></i> Back to Sign In</a>
  </div>
  
  <script src="../js/a11y.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      document.getElementById('sendResetBtn')?.addEventListener('click', sendResetLink);
      document.getElementById('resendResetLink')?.addEventListener('click', sendResetLink);
    });
    
    function sendResetLink() {
      const email = document.getElementById('resetEmail').value.trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          if (window.announce) window.announce('Please enter a valid email address', 'polite');
        return;
      }
      
      document.getElementById('sentEmail').textContent = email;
      document.getElementById('formState').classList.add('hidden');
      document.getElementById('successState').classList.add('active');
        if (window.announce) window.announce('Password reset link sent to ' + email, 'polite');
    }
  </script>
</body>
</html>
