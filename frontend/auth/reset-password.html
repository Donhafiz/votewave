<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - VoteWave</title>
  <meta name="description" content="Reset your VoteWave password">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m9 12 2 2 4-4'/%3E%3Cpath d='M5 7c0-1.1.9-2 2-2h10a2 2 0 0 1 2 2v12H5V7z'/%3E%3Cpath d='M22 19H2'/%3E%3C/svg%3E" type="image/svg+xml">

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
  <!-- Home Button -->
  <a href="../index.html" class="home-button" style="position: fixed; top: var(--space-4); left: var(--space-4); z-index: 100; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-4); background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: var(--radius-lg); color: var(--text-secondary); font-weight: 500; text-decoration: none; transition: all var(--transition-fast);">
    <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
    <span>Home</span>
  </a>

  <div class="auth-container" role="main" aria-label="Reset password">
    <div id="resetStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <!-- Left Side - Visual -->
    <div class="auth-visual">
      <div class="visual-content">
        <div class="logo">
          <i data-lucide="vote" class="logo-icon"></i>
          <span>VoteWave</span>
        </div>
        <h1 class="visual-title">Reset Your Password</h1>
        <p class="visual-description">
          Enter your new password below to complete the reset process.
        </p>
      </div>
      <div class="visual-decoration">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
      </div>
    </div>

    <!-- Right Side - Form -->
    <div class="auth-form-container">
      <div class="auth-form-wrapper">
        <div class="form-header">
          <div class="otp-icon">
            <i data-lucide="lock"></i>
          </div>
          <h2>Reset Password</h2>
          <p>Enter your new password</p>
        </div>

        <form class="auth-form" id="resetForm" novalidate>
          <div class="form-group">
            <label for="password">New Password</label>
            <div class="input-wrapper">
              <i data-lucide="lock" class="input-icon"></i>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter new password"
                required
                minlength="6"
              >
              <button type="button" class="password-toggle" id="passwordToggle">
                <i data-lucide="eye" class="eye-icon"></i>
              </button>
            </div>
            <div class="password-strength" id="passwordStrength"></div>
            <span class="error-message" id="passwordError"></span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <i data-lucide="lock" class="input-icon"></i>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm new password"
                required
                minlength="6"
              >
              <button type="button" class="password-toggle" id="confirmPasswordToggle">
                <i data-lucide="eye" class="eye-icon"></i>
              </button>
            </div>
            <span class="error-message" id="confirmPasswordError"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
            <span>Reset Password</span>
            <i data-lucide="check"></i>
          </button>
        </form>

        <div class="back-link">
          <a href="login.html">
            <i data-lucide="arrow-left"></i>
            <span>Back to Sign In</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Footer -->
  <footer class="footer" style="position: fixed; bottom: 0; left: 0; right: 0; padding: var(--space-4); background: transparent; border: none;">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0; text-align: center;">
        <p style="font-size: 0.75rem; color: var(--text-muted);">&copy; 2026 VoteWave. Site powered by <strong style="color: var(--primary-600);">Star Media Tech</strong></p>
      </div>
    </div>
  </footer>

  <script src="../js/a11y.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
