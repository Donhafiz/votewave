<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Success - VoteWave</title>
  <meta name="description" content="Completing OAuth authentication - VoteWave">
  <meta name="theme-color" content="#6366f1">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }

    .icon {
      width: 4rem;
      height: 4rem;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      animation: checkmark 0.8s ease-in-out;
    }

    @keyframes checkmark {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .icon svg {
      width: 2rem;
      height: 2rem;
      color: white;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #f1f5f9;
    }

    p {
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .spinner {
      width: 2rem;
      height: 2rem;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container" role="main" aria-label="OAuth sign in completion">
    <div id="oauthStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="loadingState">
      <div class="spinner"></div>
      <h1>Completing Sign In</h1>
      <p>Please wait while we finish setting up your account...</p>
    </div>

    <div id="successState" style="display: none;">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <h1>Sign In Successful!</h1>
      <p>Redirecting you to your dashboard...</p>
    </div>

    <div id="errorState" style="display: none;">
      <div class="icon" style="background: linear-gradient(135deg, #ef4444, #dc2626);">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </div>
      <h1>Sign In Failed</h1>
      <p>There was an error completing your sign in. Please try again.</p>
      <a href="login.html" style="display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; background: #6366f1; color: white; text-decoration: none; border-radius: 0.5rem; font-weight: 500;">Back to Login</a>
    </div>
  </div>

  <script src="../js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }

      // Get tokens from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const accessToken = urlParams.get('accessToken');
      const refreshToken = urlParams.get('refreshToken');

      if (!accessToken || !refreshToken) {
        showError();
        return;
      }

      try {
        // Store tokens
        setTokens(accessToken, refreshToken);

        // Get user info
        const response = await apiRequest('/auth/me');
        if (response.success) {
          setUser(response.data);

          // Show success and redirect
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('successState').style.display = 'block';
          if (window.announce) window.announce('Sign in successful. Redirecting to your dashboard.', 'polite');

          setTimeout(() => {
            const redirectUrl = getRedirectUrl(response.data.role);
            window.location.href = redirectUrl;
          }, 2000);
        } else {
          throw new Error('Failed to get user info');
        }
      } catch (error) {
        console.error('OAuth completion error:', error);
        showError();
      }
    });

    function showError() {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display = 'block';
      if (window.announce) window.announce('There was an error completing sign in. Please try again.', 'polite');
    }
  </script>
    <script src="../js/a11y.js"></script>
</body>
</html>
