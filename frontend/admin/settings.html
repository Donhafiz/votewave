<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - VoteWave Admin</title>
  <meta name="theme-color" content="#6366f1">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="sidebar">
      <div class="admin-sidebar-header">
        <div class="admin-logo">V</div>
        <a href="dashboard.html" class="admin-brand">Vote<span>Wave</span></a>
      </div>
      <nav class="admin-sidebar-nav">
        <a href="dashboard.html" class="admin-nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="elections.html" class="admin-nav-item"><i data-lucide="vote"></i> Elections</a>
        <a href="candidates.html" class="admin-nav-item"><i data-lucide="users"></i> Candidates</a>
        <a href="results.html" class="admin-nav-item"><i data-lucide="bar-chart-3"></i> Results</a>
        <a href="users.html" class="admin-nav-item"><i data-lucide="user-cog"></i> Users</a>
        <a href="settings.html" class="admin-nav-item active"><i data-lucide="settings"></i> Settings</a>
      </nav>
    </aside>
    
    <main class="admin-main" role="main" aria-label="System settings">
      <div id="adminStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
      <header class="admin-topbar">
        <div class="admin-topbar-left">
          <button class="admin-menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button>
          <h1 style="font-size:1.1rem;">System Settings</h1>
        </div>
      </header>
      
      <div class="admin-content">
        <div class="card">
          <div class="card-header"><h3>General Settings</h3></div>
          <div class="card-body">
            <div class="admin-form-row" style="margin-bottom:1.5rem;">
              <div class="admin-form-group">
                <label>Site Name</label>
                <input type="text" value="VoteWave" id="siteName">
              </div>
              <div class="admin-form-group">
                <label>Default Timezone</label>
                <select id="timezone">
                  <option>UTC</option>
                  <option>America/New_York</option>
                  <option>Europe/London</option>
                  <option>Asia/Kolkata</option>
                  <option selected>Africa/Accra</option>
                </select>
              </div>
            </div>
            
            <div class="admin-form-checkbox" style="margin-bottom:1rem;">
              <input type="checkbox" id="registrationEnabled" checked>
              <span>Enable new user registration</span>
            </div>
            <div class="admin-form-checkbox" style="margin-bottom:1rem;">
              <input type="checkbox" id="emailVerification" checked>
              <span>Require email verification</span>
            </div>
            <div class="admin-form-checkbox" style="margin-bottom:1rem;">
              <input type="checkbox" id="maintenanceMode">
              <span>Maintenance mode (disables voting)</span>
            </div>
          </div>
        </div>
        
        <div class="card">
          <div class="card-header"><h3>Security Settings</h3></div>
          <div class="card-body">
            <div class="admin-form-row" style="margin-bottom:1.5rem;">
              <div class="admin-form-group">
                <label>Session Timeout (hours)</label>
                <input type="number" value="24" id="sessionTimeout">
              </div>
              <div class="admin-form-group">
                <label>Min Password Length</label>
                <input type="number" value="6" id="passwordMinLength">
              </div>
            </div>
            <div class="admin-form-checkbox" style="margin-bottom:1rem;">
              <input type="checkbox" id="twoFactorAuth">
              <span>Enable Two-Factor Authentication</span>
            </div>
            <div class="admin-form-checkbox" style="margin-bottom:1rem;">
              <input type="checkbox" id="auditLogging" checked>
              <span>Enable audit logging</span>
            </div>
          </div>
        </div>
        
        <div class="form-actions">
          <button class="btn btn-secondary" onclick="resetSettings()">
            <i data-lucide="rotate-ccw"></i> Reset to Defaults
          </button>
          <button class="btn btn-primary" onclick="saveSettings()">
            <i data-lucide="save"></i> Save Settings
          </button>
        </div>
      </div>
    </main>
  </div>
  
  <div class="admin-toast-container" id="toastContainer"></div>
  
  <script src="../js/a11y.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/admin-settings.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      document.getElementById('menuToggle')?.addEventListener('click', () => {
        document.getElementById('sidebar')?.classList.toggle('open');
      });
      loadSettings();
    });
    
    function loadSettings() {
      const settings = JSON.parse(localStorage.getItem('votewave_settings') || '{}');
      document.getElementById('siteName')?.value = settings.siteName || 'VoteWave';
      document.getElementById('timezone')?.value = settings.timezone || 'Africa/Accra';
      document.getElementById('registrationEnabled') ? document.getElementById('registrationEnabled').checked = (settings.registrationEnabled !== false) : null;
      document.getElementById('emailVerification') ? document.getElementById('emailVerification').checked = (settings.emailVerification !== false) : null;
      document.getElementById('maintenanceMode') ? document.getElementById('maintenanceMode').checked = (settings.maintenanceMode || false) : null;
      document.getElementById('sessionTimeout') ? document.getElementById('sessionTimeout').value = settings.sessionTimeout || 24 : null;
      document.getElementById('passwordMinLength') ? document.getElementById('passwordMinLength').value = settings.passwordMinLength || 6 : null;
      document.getElementById('twoFactorAuth') ? document.getElementById('twoFactorAuth').checked = (settings.twoFactorAuth || false) : null;
      document.getElementById('auditLogging') ? document.getElementById('auditLogging').checked = (settings.auditLogging !== false) : null;
    }
    
    function saveSettings() {
      const settings = {
        siteName: document.getElementById('siteName')?.value || 'VoteWave',
        timezone: document.getElementById('timezone')?.value || 'Africa/Accra',
        registrationEnabled: document.getElementById('registrationEnabled')?.checked || false,
        emailVerification: document.getElementById('emailVerification')?.checked || false,
        maintenanceMode: document.getElementById('maintenanceMode')?.checked || false,
        sessionTimeout: parseInt(document.getElementById('sessionTimeout')?.value || '24'),
        passwordMinLength: parseInt(document.getElementById('passwordMinLength')?.value || '6'),
        twoFactorAuth: document.getElementById('twoFactorAuth')?.checked || false,
        auditLogging: document.getElementById('auditLogging')?.checked || false,
      };
      
      localStorage.setItem('votewave_settings', JSON.stringify(settings));
      showAdminToast('Settings saved successfully!', 'success');
      if (window.announce) window.announce('Settings saved successfully', 'polite');
    }
    
    function resetSettings() {
      if (!confirm('Reset all settings to defaults?')) return;
      localStorage.removeItem('votewave_settings');
      loadSettings();
      showAdminToast('Settings reset to defaults', 'success');
      if (window.announce) window.announce('Settings reset to defaults', 'polite');
    }
  </script>
</body>
</html>
