<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elections - VoteWave Admin</title>
  <meta name="theme-color" content="#6366f1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://js.paystack.co/v2/paystack.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <!-- SIDEBAR (same as dashboard, simplified for brevity) -->
    <aside class="admin-sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">V</div>
        <a href="dashboard.html" class="sidebar-brand">Vote<span>Wave</span></a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Main</div>
          <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
          <a href="elections.html" class="nav-item active"><i data-lucide="vote"></i> Elections</a>
          <a href="candidates.html" class="nav-item"><i data-lucide="users"></i> Candidates</a>
          <a href="results.html" class="nav-item"><i data-lucide="bar-chart-3"></i> Results</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Management</div>
          <a href="users.html" class="nav-item"><i data-lucide="user-cog"></i> Users</a>
          <a href="audit.html" class="nav-item"><i data-lucide="file-text"></i> Audit Log</a>
          <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Quick Links</div>
          <a href="../../index.html" class="nav-item"><i data-lucide="globe"></i> View Site</a>
          <a href="../voter/elections.html" class="nav-item"><i data-lucide="external-link"></i> Voter Portal</a>
        </div>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="admin-main" role="main" aria-label="Manage elections">
      <div id="adminStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button>
          <div style="display:flex;align-items:center;gap:0.5rem;background:var(--admin-surface);border:1px solid var(--admin-border);border-radius:0.5rem;padding:0.4rem 0.85rem;">
            <i data-lucide="search" style="width:1rem;height:1rem;color:var(--admin-text-muted);"></i>
            <input type="text" id="tableSearch" aria-label="Search elections" placeholder="Search elections..." style="background:none;border:none;color:var(--admin-text);font-size:0.85rem;font-family:inherit;outline:none;width:200px;">
          </div>
        </div>
        <div class="topbar-right">
          <button class="topbar-icon" id="refreshBtn"><i data-lucide="refresh-cw"></i></button>
        </div>
      </header>

      <div class="admin-content">
        <div class="page-header">
          <div>
            <h1>Elections</h1>
            <p class="greeting">Manage all elections, events, and nominations.</p>
          </div>
          <button class="btn btn-primary btn-lg" id="createElectionBtn" aria-label="Create election"><i data-lucide="plus"></i> Create Election</button>
        </div>

        <!-- Filters -->
        <div class="filters">
          <button class="filter-btn active" data-status="all">All</button>
          <button class="filter-btn" data-status="active">Active</button>
          <button class="filter-btn" data-status="draft">Draft</button>
          <button class="filter-btn" data-status="upcoming">Upcoming</button>
          <button class="filter-btn" data-status="completed">Completed</button>
          <select id="statusFilter" aria-label="Filter by status" class="filter-select" style="margin-left:auto;">
            <option value="">All Status</option>
            <option value="draft">Draft</option>
            <option value="active">Active</option>
            <option value="upcoming">Upcoming</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <!-- Table -->
        <div class="card">
          <div style="overflow-x:auto;">
            <table class="table">
              <thead>
                <tr><th>Election</th><th>Status</th><th>Dates</th><th>Votes</th><th>Turnout</th><th>Actions</th></tr>
              </thead>
              <tbody id="electionsTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- CREATE/EDIT MODAL -->
  <div class="modal hidden" id="electionModal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Create Election</h2>
        <button class="modal-close" id="closeModal"><i data-lucide="x"></i></button>
      </div>
      <form id="electionForm" onsubmit="return false;">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Type *</label>
            <select id="type" required>
              <option value="">Select...</option>
              <option value="student">Student</option>
              <option value="nomination">Nomination</option>
              <option value="event">Event</option>
              <option value="club">Club</option>
              <option value="corporate">Corporate</option>
              <option value="poll">Poll</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option value="draft">Draft</option>
              <option value="active">Active</option>
              <option value="upcoming">Upcoming</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Start Date</label><input type="datetime-local" id="startDate"></div>
          <div class="form-group"><label>End Date</label><input type="datetime-local" id="endDate"></div>
        </div>
        <div class="form-group">
          <label>Positions (comma separated)</label>
          <input type="text" id="positions" placeholder="President, Vice President">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveBtn">Create</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="../js/a11y.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    let editingId = null;
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('sidebar')?.classList.toggle('open'));
      document.getElementById('refreshBtn')?.addEventListener('click', loadElections);
      document.getElementById('createElectionBtn')?.addEventListener('click', () => openModal());
      document.getElementById('closeModal')?.addEventListener('click', closeModal);
      document.getElementById('cancelBtn')?.addEventListener('click', closeModal);
      document.getElementById('saveBtn')?.addEventListener('click', saveElection);
      document.querySelector('.modal-overlay')?.addEventListener('click', closeModal);
      document.getElementById('tableSearch')?.addEventListener('input', loadElections);
      document.getElementById('statusFilter')?.addEventListener('change', loadElections);
      document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const statusFilterEl = document.getElementById('statusFilter');
        if (statusFilterEl) statusFilterEl.value = this.dataset.status === 'all' ? '' : this.dataset.status;
        loadElections();
      }));
      // Check URL for edit/create params
      const params = new URLSearchParams(window.location.search);
      if (params.get('action') === 'create') openModal();
      else if (params.get('edit')) loadElectionForEdit(params.get('edit'));
      loadElections();
    });

    function loadElections() {
      const elections = JSON.parse(localStorage.getItem('votewave_elections') || '[]');
      const search = document.getElementById('tableSearch')?.value?.toLowerCase() || '';
      const status = document.getElementById('statusFilter')?.value || '';
      let filtered = elections;
      if (status) filtered = filtered.filter(e => e.status === status);
      if (search) filtered = filtered.filter(e => e.title.toLowerCase().includes(search));
      const tbody = document.getElementById('electionsTableBody');
      if (tbody) tbody.innerHTML = filtered.map(e => `
        <tr>
          <td><strong>${escapeHtml(e.title)}</strong></td>
          <td><span class="badge badge-${e.status}">${e.status}</span></td>
          <td>${e.startDate ? new Date(e.startDate).toLocaleDateString() : '-'} → ${e.endDate ? new Date(e.endDate).toLocaleDateString() : '-'}</td>
          <td>${e.totalVotes || 0}</td>
          <td>${e.turnout || 0}%</td>
          <td>
            <div class="action-btns">
              <button class="action-btn" onclick="editElection('${e._id}')"><i data-lucide="edit-2" style="width:14px"></i></button>
              <button class="action-btn danger" onclick="deleteElection('${e._id}')"><i data-lucide="trash-2" style="width:14px"></i></button>
            </div>
          </td>
        </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;padding:2rem;">No elections found</td></tr>';
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function openModal(election = null) {
      editingId = election?._id || null;
      document.getElementById('modalTitle').textContent = election ? 'Edit Election' : 'Create Election';
      document.getElementById('title').value = election?.title || '';
      document.getElementById('type').value = election?.type || '';
      document.getElementById('status').value = election?.status || 'draft';
      document.getElementById('startDate').value = election?.startDate ? new Date(election.startDate).toISOString().slice(0,16) : '';
      document.getElementById('endDate').value = election?.endDate ? new Date(election.endDate).toISOString().slice(0,16) : '';
      document.getElementById('positions').value = (election?.positions || []).join(', ');
      document.getElementById('electionModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('electionModal').classList.add('hidden'); editingId = null; }

    function saveElection() {
      const title = document.getElementById('title').value.trim();
      if (!title) { showToast('Title is required', 'error'); return; }
      const elections = JSON.parse(localStorage.getItem('votewave_elections') || '[]');
      const data = {
        _id: editingId || Date.now().toString(),
        title,
        type: document.getElementById('type').value,
        status: document.getElementById('status').value,
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        positions: document.getElementById('positions').value.split(',').map(p => p.trim()).filter(Boolean),
        totalVotes: 0,
        turnout: 0
      };
      if (editingId) {
        const idx = elections.findIndex(e => e._id === editingId);
        if (idx !== -1) elections[idx] = data;
      } else elections.push(data);
      localStorage.setItem('votewave_elections', JSON.stringify(elections));
      closeModal();
      showToast(editingId ? 'Election updated' : 'Election created', 'success');
      loadElections();
    }

    function editElection(id) {
      const elections = JSON.parse(localStorage.getItem('votewave_elections') || '[]');
      const election = elections.find(e => e._id === id);
      if (election) openModal(election);
    }

    function deleteElection(id) {
      if (!confirm('Delete this election?')) return;
      let elections = JSON.parse(localStorage.getItem('votewave_elections') || '[]');
      elections = elections.filter(e => e._id !== id);
      localStorage.setItem('votewave_elections', JSON.stringify(elections));
      showToast('Deleted', 'success');
      loadElections();
    }

    function loadElectionForEdit(id) {
      const elections = JSON.parse(localStorage.getItem('votewave_elections') || '[]');
      const election = elections.find(e => e._id === id);
      if (election) openModal(election);
    }

    function showToast(msg, type) {
      const container = document.getElementById('toastContainer');
      const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = msg;
      container.appendChild(t);
      if (window.announce) window.announce(msg, 'polite');
      setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(100%)'; t.style.transition='0.3s'; setTimeout(()=>t.remove(),300); }, 3500);
    }

    function escapeHtml(text) {
      const div = document.createElement('div'); div.textContent = text || ''; return div.innerHTML;
    }
  </script>
</body>
</html>
