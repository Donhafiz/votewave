<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results - VoteWave Admin</title>
  <meta name="theme-color" content="#6366f1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">V</div>
        <a href="dashboard.html" class="sidebar-brand">Vote<span>Wave</span></a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="elections.html" class="nav-item"><i data-lucide="vote"></i> Elections</a>
        <a href="candidates.html" class="nav-item"><i data-lucide="users"></i> Candidates</a>
        <a href="results.html" class="nav-item active"><i data-lucide="bar-chart-3"></i> Results</a>
        <a href="users.html" class="nav-item"><i data-lucide="user-cog"></i> Users</a>
        <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
      </nav>
    </aside>
    <main class="admin-main" role="main" aria-label="Election results">
      <div id="adminStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>
      <header class="admin-topbar">
        <div class="topbar-left"><button class="menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button><h2>Results</h2></div>
        <div class="topbar-right">
          <button class="btn btn-secondary btn-sm" onclick="exportCSV()"><i data-lucide="download"></i> Export CSV</button>
        </div>
      </header>
      <div class="admin-content">
        <div class="filters">
          <select id="electionSelect" aria-label="Select election" class="filter-select" style="min-width:300px;" onchange="loadResults(this.value)">
            <option value="">Select an election...</option>
          </select>
        </div>
        <div class="stats-grid" id="resultsStats" style="display:none;">
          <div class="stat-card"><div class="stat-icon purple"><i data-lucide="users"></i></div><div class="stat-value" id="eligible">0</div><div class="stat-label">Eligible Voters</div></div>
          <div class="stat-card"><div class="stat-icon green"><i data-lucide="check-circle"></i></div><div class="stat-value" id="votesCast">0</div><div class="stat-label">Votes Cast</div></div>
          <div class="stat-card"><div class="stat-icon cyan"><i data-lucide="activity"></i></div><div class="stat-value" id="turnout">0%</div><div class="stat-label">Turnout</div></div>
        </div>
        <div class="card" id="resultsChartCard" style="display:none;">
          <div class="card-header"><h3>Vote Distribution</h3></div>
          <div style="padding:1rem;height:350px;"><canvas id="barChart"></canvas></div>
        </div>
        <div class="card" id="resultsTableCard" style="display:none;">
          <div style="overflow-x:auto;">
            <table class="table">
              <thead><tr><th>Candidate</th><th>Position</th><th>Votes</th><th>%</th></tr></thead>
              <tbody id="resultsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="../js/a11y.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    let chart;
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('sidebar')?.classList.toggle('open'));
      loadElectionList();
    });
    function loadElectionList() {
      const elections = JSON.parse(localStorage.getItem('votewave_elections') || '[]');
      const select = document.getElementById('electionSelect');
      elections.forEach(e => { const o = document.createElement('option'); o.value = e._id; o.text = e.title; if (select) select.appendChild(o); });
    }
    function loadResults(id) {
      if (!id) return;
      document.getElementById('resultsStats') && (document.getElementById('resultsStats').style.display = 'grid');
      document.getElementById('resultsChartCard') && (document.getElementById('resultsChartCard').style.display = 'block');
      document.getElementById('resultsTableCard') && (document.getElementById('resultsTableCard').style.display = 'block');
      const candidates = JSON.parse(localStorage.getItem('votewave_candidates') || '[]').filter(c => c.electionId === id);
      candidates.sort((a,b) => (b.votes||0) - (a.votes||0));
      const totalVotes = candidates.reduce((sum,c) => sum + (c.votes||0), 0);
      document.getElementById('eligible') && (document.getElementById('eligible').textContent = '1,500');
      document.getElementById('votesCast') && (document.getElementById('votesCast').textContent = totalVotes);
      document.getElementById('turnout') && (document.getElementById('turnout').textContent = totalVotes ? Math.round((totalVotes/1500)*100) + '%' : '0%');
      const resultsBody = document.getElementById('resultsBody');
      if (resultsBody) resultsBody.innerHTML = candidates.map(c => `
        <tr><td><strong>${c.firstName} ${c.lastName}</strong></td><td>${c.position||'—'}</td>
        <td>${c.votes||0}</td><td>${totalVotes ? Math.round(((c.votes||0)/totalVotes)*100) : 0}%</td></tr>`).join('');
      if (chart) chart.destroy();
      const ctx = document.getElementById('barChart');
      if (ctx) chart = new Chart(ctx, { type:'bar', data:{labels:candidates.map(c=>c.firstName+' '+c.lastName), datasets:[{data:candidates.map(c=>c.votes||0), backgroundColor:'#6366f1', borderRadius:6}]}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{color:'#94a3b8'}},y:{ticks:{color:'#94a3b8'}}}} });
    }
    function exportCSV() {
      const rows = [['Candidate','Position','Votes','%']];
      document.querySelectorAll('#resultsBody tr').forEach(tr => rows.push([...tr.querySelectorAll('td')].map(td=>td.textContent)));
      const csv = rows.map(r=>r.join(',')).join('\n');
      const blob = new Blob([csv],{type:'text/csv'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'results.csv'; a.click();
      if (window.announce) window.announce('Results exported as CSV', 'polite');
    }
  </script>
</body>
</html>
