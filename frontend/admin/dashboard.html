<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VoteWave Admin Dashboard</title>

  <!-- SINGLE CSS -->
  <link rel="stylesheet" href="../css/admin.css" />

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Chart.js (LOAD ONCE ONLY) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="admin-body">

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <div class="admin-logo">VW</div>
      <div class="admin-brand">Vote<span>Wave</span></div>
    </div>

    <nav class="admin-sidebar-nav">
      <a class="admin-nav-item active" href="#">Dashboard</a>
      <a class="admin-nav-item" href="#">Elections</a>
      <a class="admin-nav-item" href="#">Candidates</a>
      <a class="admin-nav-item" href="#">Results</a>
      <a class="admin-nav-item" href="#">Users</a>
      <a class="admin-nav-item" href="#">Settings</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">

    <!-- TOPBAR -->
    <header class="admin-topbar">
      <h1>Dashboard</h1>

      <div>
        <button class="btn btn-secondary">Notifications</button>
        <button class="btn btn-primary">New Election</button>
      </div>
    </header>

    <!-- CONTENT -->
    <section class="admin-content">

      <!-- STATS -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="totalElections">0</div>
          <div class="stat-label">Elections</div>
        </div>

        <div class="stat-card">
          <div class="stat-value" id="activeElections">0</div>
          <div class="stat-label">Active</div>
        </div>

        <div class="stat-card">
          <div class="stat-value" id="totalUsers">0</div>
          <div class="stat-label">Users</div>
        </div>

        <div class="stat-card">
          <div class="stat-value" id="totalVotes">0</div>
          <div class="stat-label">Votes</div>
        </div>
      </div>

      <!-- CHARTS -->
      <div class="card">
        <div class="card-header">
          <h3>Voting Activity</h3>
        </div>
        <div class="card-body">
          <canvas id="activityChart" height="120"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Election Status</h3>
        </div>
        <div class="card-body">
          <canvas id="statusChart" height="120"></canvas>
        </div>
      </div>

    </section>

  </main>

</div>

<!-- ================= SCRIPTS (IMPORTANT ORDER) ================= -->

<!-- 1. SOCKET.IO (MUST LOAD FIRST FOR REAL-TIME) -->
<script src="/socket.io/socket.io.js"></script>

<!-- 2. DASHBOARD LOGIC -->
<script src="../js/admin-dashboard.js"></script>

</body>
</html>
